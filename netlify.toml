# Netlify builds the page from src/ on every deploy and serves this directory. index.html
# and musicatlas.json are generated and not in git: the build is a 30-line Node script
# with no dependencies, so building on Netlify costs about a second and removes the two
# ways a committed build went wrong (a src/ edit pushed without a rebuild never reached
# the site; two branches that each rebuilt always conflicted on a 1.2 MB generated file).
# These lines pin what the project's settings already say, so the setup lives in the
# repo and not only in a dashboard.

[build]
  publish = "."
  command = "node src/build.js"
  # Skip the deploy when nothing served changed. Netlify runs this in the repo; exit 0
  # means "nothing to do". Commits that touch only test/, the tools that are not the
  # build, or the docs are not the site. Add a path here if it starts being served.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src tools/catalog.js suggest.html contribute.html appicon.svg netlify.toml netlify assets wiki"

[build.environment]
  NODE_VERSION = "22"
  # The root package.json has no dependencies (Playwright lives in test/package.json), so
  # Netlify's install step installs nothing. This stays as a guard: if a dependency ever
  # lands at the root again, it keeps the deploy from downloading browsers.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  # suggest.mjs, served at /api/suggest
  directory = "netlify/functions"

# short addresses for the two pages that get handed to people
[[redirects]]
  from = "/suggest"
  to = "/suggest.html"
  status = 200

[[redirects]]
  from = "/contribute"
  to = "/contribute.html"
  status = 200

# Images. Netlify's default is max-age=0, so every cover is revalidated on every visit:
# a round trip per image even when nothing changed. Filenames are stable stems, not
# content hashes, so these cannot be immutable; a week plus stale-while-revalidate means a
# repeat visit paints from cache and a replaced file shows up within a day or so.
# index.html keeps the default and is always fresh.
[[headers]]
  for = "/assets/style-cover-art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/artists/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/album-covers/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/collections/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/style-previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/assets/crossplay-cover-art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/wiki/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Images moved under /assets/ (one folder per kind). The old addresses redirect so a
# copy of the page loaded before the move, or a link shared to an image, still resolves.
[[redirects]]
  from = "/art/*"
  to = "/assets/style-cover-art/:splat"
  status = 301

[[redirects]]
  from = "/artists/*"
  to = "/assets/artists/:splat"
  status = 301

[[redirects]]
  from = "/covers/*"
  to = "/assets/album-covers/:splat"
  status = 301

[[redirects]]
  from = "/moods/*"
  to = "/assets/collections/:splat"
  status = 301

[[redirects]]
  from = "/styles/*"
  to = "/assets/style-previews/:splat"
  status = 301

[[redirects]]
  from = "/xplay/*"
  to = "/assets/crossplay-cover-art/:splat"
  status = 301

