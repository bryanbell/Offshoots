<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Suggest for Music Atlas</title>
<style>
/* The map's own palette and type, so the form reads as part of Music Atlas and not as a
   third-party widget bolted onto it. Light by default, dark with the system. */
:root{
  --bg:#f2f2f7; --panel:#ffffff; --fg:#1a1a1c; --muted:#5f5f66; --line:#d8d8dc;
  --fill:#ebebf0; --accent:#007aff; --accent-fg:#ffffff; --ok:#248a3d; --bad:#c4302b;
  --ring:color-mix(in srgb,var(--accent) 35%,transparent);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1c1c1e; --fg:#f5f5f7; --muted:#b0b0b6; --line:#3a3a3c;
  --fill:#2c2c2e; --accent:#0a84ff; --ok:#30d158; --bad:#ff6961;
}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --fg:#f5f5f7; --muted:#b0b0b6; --line:#3a3a3c;
  --fill:#2c2c2e; --accent:#0a84ff; --ok:#30d158; --bad:#ff6961;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
/* room to scroll into while the phone keyboard is up, so the last fields can rise above it */
main.kb{padding-bottom:60vh}
a{color:var(--accent)}
.home{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);
  text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.02em}
.home svg{width:15px;height:15px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 8px}
.lede{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border-radius:14px;padding:4px 16px;margin:0 0 16px}
.field{padding:14px 0}
.field + .field{border-top:.5px solid var(--line)}
label,.lbl{display:block;font-weight:600;font-size:13px;margin:0 0 8px}
.hint{font-weight:400;color:var(--muted)}
input[type=url],input[type=text],input[type=search],textarea{
  width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--fill);
  border:0;border-radius:10px;padding:11px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
textarea{min-height:88px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.seg input:focus-visible + span{
  outline:0;box-shadow:0 0 0 4px var(--ring)}
::placeholder{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{margin:0;font-weight:500;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;
  background:var(--fill);cursor:pointer;user-select:none;-webkit-user-select:none}
.seg input:checked + span{background:var(--accent);color:var(--accent-fg)}
.picker{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 6px 0 12px;
  border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));font-size:14px;font-weight:500}
.chip button{all:unset;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  cursor:pointer;color:var(--muted)}
.chip button:hover{background:var(--fill);color:var(--fg)}
.chip button:focus-visible{box-shadow:0 0 0 3px var(--ring)}
.res{list-style:none;margin:6px 0 0;padding:4px;border-radius:12px;background:var(--panel);
  box-shadow:0 0 0 .5px var(--line),0 8px 24px rgb(0 0 0 / .14);position:absolute;left:0;right:0;z-index:2;
  max-height:300px;overflow:auto}
.res:empty{display:none}
.res li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:10px 12px;
  border-radius:8px;cursor:pointer;min-height:44px}
.res li[aria-selected=true]{background:var(--fill)}
.res .y{color:var(--muted);font:500 12px var(--f-mono);white-space:nowrap}
.res .f{display:block;color:var(--muted);font-size:12px}
.who{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);
  margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--panel)}
.who button{all:unset;color:var(--accent);cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.go{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);
  font:600 16px var(--f-body);cursor:pointer}
.go[disabled]{opacity:.55;cursor:default}
.msg{min-height:22px;margin:12px 2px 0;font-size:14px}
.msg.bad{color:var(--bad)}
.done{text-align:center;padding:28px 16px}
.done .tick{width:48px;height:48px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ok)}
.done .tick svg{width:24px;height:24px}
.done h2{margin:0 0 6px;font-size:20px}
.done p{margin:0 0 18px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:11px;
  background:var(--fill);color:var(--fg);border:0;font:600 15px var(--f-body);text-decoration:none;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <a class="home" href="./"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>Music Atlas</a>
  <h1>Suggest something</h1>
  <p class="lede">Something worth reading, watching or hearing about a style in Music Atlas. Every suggestion is read before it goes on.</p>

  <div class="who" id="who" hidden>
    <span>Filing with your contributor key.</span>
    <button type="button" id="forget">Not you?</button>
  </div>

  <form id="f" novalidate>
    <div class="card">
      <div class="field">
        <label for="url">Link</label>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" required>
      </div>
      <div class="field">
        <label for="title">Title <span class="hint">what it's called</span></label>
        <input id="title" name="title" type="text" autocomplete="off" maxlength="300">
      </div>
      <div class="field">
        <span class="lbl" id="medlbl">What is it</span>
        <div class="seg" role="radiogroup" aria-labelledby="medlbl">
          <label><input type="radio" name="medium" value="read" checked><span>Article</span></label>
          <label><input type="radio" name="medium" value="book"><span>Book</span></label>
          <label><input type="radio" name="medium" value="watch"><span>Video</span></label>
          <label><input type="radio" name="medium" value="listen"><span>Podcast or audio</span></label>
          <label><input type="radio" name="medium" value="look"><span>Photos</span></label>
          <label><input type="radio" name="medium" value="site"><span>Website</span></label>
        </div>
      </div>
      <div class="field picker">
        <label for="sq">Where it might fit <span class="hint">optional, pick as many as five</span></label>
        <div class="chips" id="chips"></div>
        <input id="sq" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Search styles" role="combobox" aria-expanded="false" aria-controls="res" aria-autocomplete="list">
        <ul class="res" id="res" role="listbox" aria-label="Styles"></ul>
      </div>
      <div class="field">
        <label for="note">Why it's worth it <span class="hint">optional</span></label>
        <textarea id="note" name="note" maxlength="1000" placeholder="One line on what it gives you that the atlas can't."></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
    </div>
    <button class="go" id="go" type="submit">Send it</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <div class="card done" id="done" hidden>
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h2 id="donet">Sent</h2>
    <p>It gets read before it goes into the atlas.</p>
    <div class="row">
      <button class="btn" type="button" id="again">Suggest another</button>
      <button class="btn" type="button" id="close" hidden>Close</button>
      <a class="btn" href="./" id="back">Back to Music Atlas</a>
    </div>
  </div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
// The bookmarklet puts what it read off the page in the hash, so none of it is sent to
// the server just by opening this page; the in-app link uses ?s= for the style it came
// from. Both are read the same way.
const P=new URLSearchParams(location.search);
for(const [k,v] of new URLSearchParams(location.hash.slice(1))) P.set(k,v);
// The bookmarklet reuses one small window. Clicked again while it is still open, it only
// changes the hash, which is not a new page: without this the form keeps the last link.
addEventListener("hashchange",()=>location.reload());

// ---------- the contributor key ----------
// Remembered once seen, so a guest who opened this from their own bookmarklet is still
// credited when they come back through the map's own Suggest link.
const KEY="musicatlas.k";
let key=P.get("k")||"";
try{ if(key) localStorage.setItem(KEY,key); else key=localStorage.getItem(KEY)||""; }catch(e){}
const showWho=()=>{ $("who").hidden=!key; };
showWho();
$("forget").onclick=()=>{ key=""; try{localStorage.removeItem(KEY);}catch(e){} showWho(); };

// ---------- what the page told us ----------
const meta={publication:P.get("p")||"", year:(P.get("d")||"").slice(0,4)};
$("url").value=P.get("u")||"";
$("title").value=P.get("t")||"";

// A first guess at the medium from where the link lives. Only a guess: the radio is
// right there, and review sets it for good.
function guess(u){
  let h="",p="";
  try{ const x=new URL(u); h=x.hostname.replace(/^www\./,""); p=x.pathname; }catch(e){ return ""; }
  if(/(^|\.)(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com)$/.test(h) || /\/video\//.test(p)) return "watch";
  if(/(^|\.)(podcasts\.apple\.com|soundcloud\.com|overcast\.fm|pca\.st|podcasts\.google\.com)$/.test(h)
     || (h==="open.spotify.com" && /^\/(episode|show)\//.test(p)) || /podcast/.test(h+p)) return "listen";
  if(/(^|\.)(bookshop\.org|goodreads\.com|books\.google\.com|openlibrary\.org)$/.test(h)
     || /\/books?\//.test(p) || /97[89]\d{10}/.test(p)) return "book";
  return "";
}
function setMedium(m){ const r=document.querySelector(`input[name=medium][value="${m}"]`); if(r) r.checked=true; }
const g=guess($("url").value); if(g) setMedium(g);
let touched=false;
document.querySelectorAll("input[name=medium]").forEach(r=>r.addEventListener("change",()=>touched=true));
$("url").addEventListener("input",()=>{ if(!touched){ const m=guess($("url").value); setMedium(m||"read"); } });

// ---------- the style picker ----------
// musicatlas.json is written by every build, so the list can never name a style the map
// does not have.
let STYLES=[], picked=[], hits=[], act=0;
const fold=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId=id=>STYLES.find(s=>s.id===id);
function drawChips(){
  $("chips").innerHTML=picked.map(id=>{ const s=byId(id); return s
    ? `<span class="chip">${esc(s.name)}<button type="button" data-rm="${esc(id)}" aria-label="Remove ${esc(s.name)}">`
      +`<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8"/></svg></button></span>` : ""; }).join("");
  $("sq").disabled = picked.length>=5;
  $("sq").placeholder = picked.length>=5 ? "Five is the most" : picked.length ? "Add another style" : "Search styles";
}
$("chips").addEventListener("click",e=>{ const b=e.target.closest("[data-rm]"); if(!b) return;
  picked=picked.filter(x=>x!==b.dataset.rm); drawChips(); $("sq").focus(); });
function search(q){
  q=fold(q.trim()); if(!q) return [];
  const out=[];
  for(const s of STYLES){
    if(picked.includes(s.id)) continue;
    const n=s._f, i=n.indexOf(q); if(i<0) continue;
    // "rock" finds Rock and Roll before Rockabilly: the whole word at the start, then the
    // start, then a word inside that starts with it, then anywhere
    const whole=!/[a-z0-9]/.test(n[i+q.length]||"");
    out.push([i===0?(whole?0:1):/[\s/&-]/.test(n[i-1])?2:3, n.length, s]);
  }
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,8).map(x=>x[2]);
}
function drawRes(){
  $("res").innerHTML=hits.map((s,i)=>`<li role="option" id="o${i}" data-i="${i}" aria-selected="${i===act}">`
    +`<span>${esc(s.name)}<span class="f">${esc(s.family)}</span></span><span class="y">${esc(s.yearLabel||s.year)}</span></li>`).join("");
  $("sq").setAttribute("aria-expanded", hits.length?"true":"false");
  if(hits.length) $("sq").setAttribute("aria-activedescendant","o"+act); else $("sq").removeAttribute("aria-activedescendant");
}
// a pick by hand leaves the cursor in the search, so the next style is one word away;
// the one filled in from the map's link does not take the cursor from the link field
function pick(s,byHand){ if(!s || picked.includes(s.id) || picked.length>=5) return;
  picked.push(s.id); $("sq").value=""; hits=[]; drawRes(); drawChips();
  if(byHand && picked.length<5) $("sq").focus(); }
$("sq").addEventListener("input",()=>{ hits=search($("sq").value); act=0; drawRes(); });
$("sq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"&&hits.length){ act=(act+1)%hits.length; drawRes(); e.preventDefault(); }
  else if(e.key==="ArrowUp"&&hits.length){ act=(act-1+hits.length)%hits.length; drawRes(); e.preventDefault(); }
  else if(e.key==="Enter"){ if(hits.length){ pick(hits[act],true); } e.preventDefault(); }
  else if(e.key==="Escape"){ hits=[]; drawRes(); }
  else if(e.key==="Backspace" && !$("sq").value && picked.length){ picked.pop(); drawChips(); }
});
// pointerdown, not click, so the choice lands before the input's blur closes the list
$("res").addEventListener("pointerdown",e=>{ const li=e.target.closest("li"); if(!li) return;
  e.preventDefault(); pick(hits[+li.dataset.i],true); });
$("sq").addEventListener("blur",()=>setTimeout(()=>{ hits=[]; drawRes(); },120));

fetch("musicatlas.json").then(r=>r.json()).then(j=>{
  STYLES=(j.styles||[]).map(s=>Object.assign(s,{_f:fold(s.name)}));
  for(const id of (P.get("s")||"").split(",")) if(byId(id)) pick(byId(id));
}).catch(()=>{ say("Couldn't load the list of styles. Check your connection and reload.",true); });

// ---------- sending ----------
function say(t,bad){ $("msg").textContent=t; $("msg").className="msg"+(bad?" bad":""); }
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  let u=$("url").value.trim();
  if(u && !/^[a-z]+:\/\//i.test(u)) u="https://"+u;
  try{ const x=new URL(u); if(!/^https?:$/.test(x.protocol)) throw 0; }
  catch(err){ say("Paste the link to the thing itself.",true); $("url").focus(); return; }
  const body={url:u, title:$("title").value.trim(),
    medium:(document.querySelector("input[name=medium]:checked")||{}).value,
    styles:picked, note:$("note").value.trim(),
    publication:meta.publication, year:meta.year, k:key, website:$("website").value};
  $("go").disabled=true; say("Sending…");
  try{
    const r=await fetch("/api/suggest",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok) throw new Error(j.error||"Couldn't send it just now. Try again in a minute.");
    $("donet").textContent = j.by ? "Sent as "+j.by.charAt(0).toUpperCase()+j.by.slice(1)+"’s pick" : "Sent";
    $("f").hidden=true; $("done").hidden=false; $("close").hidden=!window.opener;
    say("");
  }catch(err){ say(err.message||"Couldn't send it just now.",true); }
  finally{ $("go").disabled=false; }
});
$("again").onclick=()=>{ $("f").reset(); picked=[]; drawChips(); touched=false; meta.publication=""; meta.year="";
  $("done").hidden=true; $("f").hidden=false; $("url").focus(); };
$("close").onclick=()=>window.close();

// ---------- the phone keyboard ----------
// iOS scrolls a focused field just far enough to be under the keyboard's own toolbar,
// and the note box sits at the foot of the page with nowhere to scroll to. So while the
// keyboard is up the page gets room below, and the field is moved into what is left of
// the screen: the style search to the top, so its list has space under it, anything else
// with its bottom clear of the toolbar.
const vv=window.visualViewport, BAR=84;
let typing=null;
function lift(){
  if(!typing || !vv) return;
  const up = vv.height < window.innerHeight - 120;
  document.querySelector("main").classList.toggle("kb", up);
  if(!up) return;
  const r=typing.getBoundingClientRect(), top=r.top-vv.offsetTop, bottom=r.bottom-vv.offsetTop;
  let d=0;
  if(typing.id==="sq") d=top-12;
  else if(bottom > vv.height-BAR) d=bottom-(vv.height-BAR);
  else if(top < 12) d=top-12;
  if(Math.abs(d)>2) window.scrollBy({top:d, behavior:"smooth"});
}
document.addEventListener("focusin",e=>{ if(e.target.matches("input[type=url],input[type=text],input[type=search],textarea")){
  typing=e.target; setTimeout(lift,350); } });
document.addEventListener("focusout",()=>{ typing=null; setTimeout(()=>{ if(!typing) document.querySelector("main").classList.remove("kb"); },150); });
if(vv) vv.addEventListener("resize",()=>setTimeout(lift,50));
if(!$("url").value) $("url").focus();
})();
</script>
</body>
</html>
