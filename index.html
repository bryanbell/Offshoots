/* App shell: the map fills the window; title, tabs, search, details and zoom float over it. */
/* dark is the only palette: these were the light values, now replaced by the dark set,
   so the app can't render light even if data-theme is missing or set to "light". */
:root{
  --sectline:#5a5a60; --sectw:1px; --sep:color-mix(in srgb,#f5f5f7 15%,transparent); --bg:#000000; --band:#141416; --mapbg:#0f0f11; --panel:#2b2b2f; --fg:#f5f5f7; --muted:#b0b0b6; --line:#3a3a3c; --grid:#232326; --roots:#161618;
  --fill:#3d3d41; --fill2:#37373a; --scrim:rgb(0 0 0 / .6); --halo:#0f0f11; --ok:#30d158; --accent:#0a84ff; --accent-fg:#ffffff;
  --glass:rgb(44 44 48 / .86); --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .5);
  --bar:0px; --gutter:16px;
  --node-s:72%; --node-l:64%; color-scheme:dark;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* SF's own steps, at the default Large setting. Every panel rule picks one of these
     rather than inventing a size: the panel used to hold twenty different sizes, most
     of them under 13px, and the small ones were genuinely hard to read. */
  --t-title1:28px; --t-title1-lh:34px;
  --t-title2:22px; --t-title2-lh:28px;
  --t-title3:20px; --t-title3-lh:25px;
  --t-head:17px;   --t-head-lh:22px;
  --t-body:17px;   --t-body-lh:22px;
  --t-call:16px;   --t-call-lh:21px;
  --t-sub:15px;    --t-sub-lh:20px;
  --t-foot:13px;   --t-foot-lh:18px;
  --t-cap:12px;    --t-cap-lh:16px;
  --link:#5aa9ff;   /* accent is 3.87:1 here; this clears AA on the panel and on cards */
  --lite:#f5f5f7; --lite-fg:#1a1a1c; --lite-mut:#6a6a70;   /* the inverted surfaces */
  /* 44pt is the floor for anything you tap */
  --tap:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --band:#141416; --mapbg:#0f0f11; --panel:#2b2b2f; --fg:#f5f5f7; --muted:#b0b0b6; --line:#3a3a3c; --grid:#232326; --roots:#161618;
  --fill:#3d3d41; --fill2:#37373a; --scrim:rgb(0 0 0 / .6); --halo:#0f0f11; --ok:#30d158; --accent:#0a84ff; --accent-fg:#ffffff;
  --glass:rgb(44 44 48 / .86); --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .5);
  --node-s:72%; --node-l:64%; --sectline:#5a5a60; --sectw:1px; --sep:color-mix(in srgb,#f5f5f7 15%,transparent); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --band:#141416; --mapbg:#0f0f11; --panel:#2b2b2f; --fg:#f5f5f7; --muted:#b0b0b6; --line:#3a3a3c; --grid:#232326; --roots:#161618;
  --fill:#3d3d41; --fill2:#37373a; --scrim:rgb(0 0 0 / .6); --halo:#0f0f11; --ok:#30d158; --accent:#0a84ff; --accent-fg:#ffffff;
  --glass:rgb(44 44 48 / .86); --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .5);
  --node-s:72%; --node-l:64%; --sectline:#5a5a60; --sectw:1px; --sep:color-mix(in srgb,#f5f5f7 15%,transparent); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;background:var(--mapbg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow:hidden}
.c{--c:#9aa0a6}
button{font-family:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px rgb(0 0 0 / .08),0 6px 20px rgb(0 0 0 / .10)}
#app{position:fixed;inset:0}
/* top bar */
#indexView{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.tabs button,.seg button{font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body);padding:0 14px;min-height:var(--tap);border:0;border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;transition:background .15s,box-shadow .15s}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgb(0 0 0 / .12),0 0 0 .5px rgb(0 0 0 / .04);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--fill)}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#636366}
:root[data-theme="dark"] .tabs button[aria-pressed="true"],:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
.search{position:relative;width:100%}
.search input{width:100%;height:46px;font:inherit;font-size:16px;padding:0 16px 0 42px;border:0;border-radius:999px;background:var(--panel);box-shadow:0 0 0 .5px rgb(0 0 0 / .10),0 4px 14px rgb(0 0 0 / .10);color:var(--fg);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%2386868b' stroke-width='2' stroke-linecap='round'><circle cx='8.5' cy='8.5' r='5.5'/><path d='M13 13l4 4'/></svg>");background-repeat:no-repeat;background-position:15px center;background-size:17px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:0;box-shadow:0 0 0 .5px rgb(0 0 0 / .10),0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:var(--lite);color:var(--lite-fg);border-radius:12px;margin:0;padding:5px;list-style:none;box-shadow:0 0 0 .5px rgb(0 0 0 / .18),0 12px 32px rgb(0 0 0 / .45)}
.results li button{all:unset;display:flex;gap:8px;align-items:baseline;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;cursor:pointer}
.results li button:hover,.results li button.act{background:rgb(0 0 0 / .07)}
.results small{color:var(--lite-mut);font-size:var(--t-foot);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button:focus-visible,.chip:focus-visible,.link:focus-visible{outline:0;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
/* map */
.mapbox{position:absolute;inset:0;background:var(--mapbg)}
#scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
/* the map is draggable with a mouse, so the background says so. Only where there is a
   real pointer: a touch screen pans with a finger and would just get an odd cursor. */
@media (hover:hover) and (pointer:fine){ #scroller{cursor:grab} }
body.panning #scroller,body.panning #chart,body.panning #chart .n{cursor:grabbing}
body.panning{user-select:none;-webkit-user-select:none}
#inner{position:relative}
#spacer{height:calc(var(--bar) + env(safe-area-inset-top,0px))}
#axis{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:4;background:color-mix(in srgb,var(--mapbg) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-bottom:.5px solid var(--line)}
#axis{overflow:visible}
#corner{display:none}
#axis text{fill:var(--muted);font:500 12px var(--f-mono)}
@media (max-width:699px){ #axis text{font-size:11px} }
#axis .rt{font-family:var(--f-body);font-weight:500}
#axis .now{fill:var(--accent);font-weight:700}
#lanes{position:absolute;left:0;z-index:3;pointer-events:none;will-change:transform}
/* the band at the top has no family, so the lane column would end in a bare notch.
   This fills it, in grey, so the strip reads as one continuous column. */
.lane.fill{position:absolute;background:color-mix(in srgb,var(--fg) 7%,transparent);
  border-radius:0 7px 7px 0}
/* the map's own title row, above the first lane. It is in the scroller so it moves up
   with the chart, but pinned horizontally like the lane strip, so panning the timeline
   does not drag the title off the screen. */
/* nothing in it is clickable, so it does not swallow taps: the band is map space, and a
   tap there clears the selection exactly like a tap on any other empty part of the chart */
#maphead{position:absolute;left:0;z-index:3;pointer-events:none;box-sizing:border-box;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;
  /* the back and map pills float at the top left of the map, so the row starts clear of
     them rather than under them. It is a constant indent, not one that appears with the
     pills: the band's height is measured once per render and must not change on selection. */
  padding:14px 72px 16px 72px}
#maphead .mh{flex:none;margin:0;font:600 var(--t-head)/1.15 var(--f-body);letter-spacing:-.012em;
  color:color-mix(in srgb,var(--fg) 62%,transparent)}
#maphead .mmeta{margin:0;font:400 var(--t-foot)/1.3 var(--f-mono);
  color:color-mix(in srgb,var(--muted) 78%,transparent)}
@media (max-width:699px){ #maphead{padding:11px 64px 13px 64px} }

.lane{--lf:13px;position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 7px 3px;border-radius:0;
  background:color-mix(in srgb,var(--c) 11%,var(--mapbg));box-shadow:inset 3px 0 0 var(--c),inset -.5px 0 0 var(--line);
  overflow:hidden;box-sizing:border-box;pointer-events:auto;cursor:pointer;transition:opacity .2s,background .15s}
.lane:hover{background:color-mix(in srgb,var(--c) 18%,var(--mapbg))}
.lane.dim{opacity:.4}
.lane .vt{writing-mode:vertical-rl;font-family:ui-rounded,"SF Pro Rounded",var(--f-body);font-weight:600;font-size:var(--lf);letter-spacing:.02em;white-space:nowrap;color:color-mix(in srgb,var(--c) 85%,var(--fg))}
.lane .cnt{flex:none;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:transparent;color:color-mix(in srgb,var(--c) 85%,var(--fg));font:600 11px var(--f-mono);letter-spacing:-.04em;box-shadow:inset 0 0 0 1.25px color-mix(in srgb,var(--c) 70%,transparent)}
svg{display:block}
#chart .band{fill-opacity:var(--bandA,.12)}
#chart .band.b2{fill-opacity:var(--bandB,.045)}
#chart .lanedge{stroke:var(--laneline,rgb(255 255 255 / .055));stroke-width:1;shape-rendering:crispEdges}
#chart .rootzone{fill:var(--roots)}
#chart .g5{stroke:var(--grid);stroke-width:1}
#chart .divider{stroke:var(--muted);stroke-width:2;opacity:.5}
#chart .g10{stroke:var(--line);stroke-width:.75}
#chart .nowline{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
#chart .e{fill:none;stroke:var(--c);stroke-width:1;opacity:0;transition:opacity .15s}
#chart .n{cursor:pointer;transition:opacity .15s}
#chart .n .hit{fill:transparent}
#chart .n circle{fill:var(--c);stroke:var(--mapbg);stroke-width:1.5}
#chart .n .ply{fill:var(--c);stroke:none;pointer-events:none}
#chart .n.has circle{fill:var(--mapbg);stroke:none}   /* a disc behind the triangle so it doesn't read as an arrowhead on a line */
#chart .n text{fill:var(--fg);font-family:var(--f-body);font-size:var(--fs,12px);font-weight:500;letter-spacing:-.01em;stroke:none}
#chart .n text.halo{fill:none;stroke:var(--halo);stroke-width:.32em;stroke-linejoin:round;stroke-opacity:.75;pointer-events:none}
#chart .n.root text{font-style:italic;font-weight:400}
#chart .n:hover text:not(.halo){fill:var(--accent)}
#chart .ck{fill:var(--ok);font-weight:700}
#chart.lod .n.leaf text{display:none}
#chart.lod .n.leaf:hover text,#chart.lod.sel .n.leaf.on text{display:block}
#chart.lod .n.leaf circle{opacity:.7}
#chart.sel .n{opacity:.18}
#chart.sel .n.on{opacity:1}
#chart.sel .n.cur text:not(.halo){font-weight:700;fill:var(--accent)}
#chart.sel .n.cur text.halo{font-weight:700}
#chart.sel .n.cur circle{stroke:var(--accent);stroke-width:2.5}
#chart.sel .e{opacity:0}
#chart.sel .e.on{opacity:.55;stroke-width:1.3}
#chart.sel .e.dir{opacity:1;stroke-width:2}
#chart.sel .e.on.d2{opacity:.4;stroke-width:1.2}
#chart.sel .e.on.d3{opacity:.2;stroke-width:1}
#chart.sel .n.on.d2{opacity:.8}
#chart.sel .n.on.d3{opacity:.55}
/* zoom */
.zoom{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;flex-direction:column;border-radius:999px;overflow:hidden}
.zoom button{width:44px;height:44px;border:0;background:transparent;color:var(--fg);font:400 22px/1 var(--f-body);cursor:pointer;touch-action:manipulation}
.zoom button:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.zoom #zreset{height:26px;font:500 10.5px var(--f-mono);border-block:.5px solid var(--line);color:var(--muted)}
.zoom button:disabled{opacity:.3;cursor:default}
/* details panel */
.close{display:none;flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);font-size:17px;line-height:1;cursor:pointer}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:var(--t-foot);letter-spacing:0;color:var(--muted);font-weight:600}
.eyebrow .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
aside h2{font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.022em;margin:8px 0 4px;text-wrap:balance}
.yr{font-family:var(--f-mono);font-size:var(--t-sub);color:var(--muted)}
.note{margin:12px 0 8px;font-size:var(--t-body);line-height:var(--t-body-lh)}
.artists{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;margin:0 0 16px;font-size:var(--t-body);line-height:var(--t-body-lh)}
.artists span{font-size:var(--t-foot);letter-spacing:0;color:var(--muted);font-weight:600;margin-right:2px}
.artists b{font-weight:500}
.artists b:not(:last-child)::after{content:" ·";color:var(--muted)}
.seg{margin-bottom:6px}
.seg button{padding:0 14px;min-height:var(--tap);font-size:var(--t-sub)}
aside h3,.pcard h3.sec{font:600 var(--t-head)/var(--t-head-lh) var(--f-body);letter-spacing:-.01em;text-transform:none;color:var(--fg);margin:24px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:0;max-width:100%;min-height:calc(var(--tap) - 4px);box-sizing:border-box;font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body);padding:0 12px;border-radius:999px;border:0;background:var(--fill2);color:var(--fg);cursor:pointer;transition:background .15s}
.chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip>i.nm{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:var(--fill)}
/* listening modes */
.sectaside{font:400 var(--t-foot)/var(--t-foot-lh) var(--f-body);color:var(--muted);opacity:1}
.modechip{gap:8px;padding:0 12px}
.modechip{--lvc:#9aa0a6}
.modechip.lv1{--lvc:#7aa2f7}
.modechip.lv2{--lvc:#5bbda4}
.modechip.lv3{--lvc:#e8c24a}
.modechip.lv4{--lvc:#ee8f4e}
.modechip.lv5{--lvc:#e2604a}
.modechip{background:color-mix(in srgb,var(--lvc) 15%,var(--fill2));
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--lvc) 26%,transparent)}
.modechip:hover{background:color-mix(in srgb,var(--lvc) 26%,var(--fill2))}
.modechip.on{background:var(--fg);box-shadow:none}
.modechip.on .mi{color:var(--lvc);opacity:1}
.modechip .mi{flex:none;display:flex;width:18px;height:18px;opacity:.85;color:var(--lvc)}
.modechip .mi svg{width:100%;height:100%}
.modechip.on .mi{opacity:1}
.modechip::before{display:none}
.modechip.on{background:var(--fg);color:var(--bg)}
.modeout{margin-top:20px}
/* the heading repeats the chip's icon, so the list you scrolled to names its own chip */
.modettl{margin:0;font:700 var(--t-title3)/var(--t-title3-lh) var(--f-body);letter-spacing:-.02em;color:var(--fg);display:flex;align-items:center;gap:8px}
.modettl .mi{flex:none;display:flex;width:20px;height:20px}
.modettl .mi svg{width:100%;height:100%}
.modettl .mtx{min-width:0;flex:1 1 auto}
/* the chips are scrolled off the top by the time this list is in view, so the heading
   carries the way back to them */
/* the same underlined-text treatment the service picker uses, rather than a second
   round button competing with the share and play marks */
.modeup{all:unset;box-sizing:border-box;flex:none;display:inline-flex;align-items:center;gap:4px;
  cursor:pointer;color:var(--muted);font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body);
  min-height:var(--tap);padding:0 0 0 12px;margin:0;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.modeup .upchev{flex:none;width:12px;height:12px;opacity:.75}
.modeup:hover{color:var(--fg);text-decoration-color:var(--fg)}
.modeup:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:4px}
@media (max-width:899px){ .modeup{font-size:var(--t-sub);padding:0 0 0 12px;margin:0} }
.modewhy{margin:6px 0 14px;font-size:var(--t-sub);line-height:var(--t-sub-lh);color:var(--muted);max-width:60ch}
/* One grouped block, the way a list reads in Music or Settings: a single shaded
   ground, rows flush inside it, and a hairline between rows that starts where the
   text starts rather than cutting the whole width. Scoped to .picks because the
   featured row carries .pick too and stays its own card. */
.picks{display:flex;flex-direction:column;gap:0;background:var(--fill2);border-radius:14px;
  --seplead:33px}   /* 16 padding + 8 dot + 9 gap: the separator lines up with the title */
.picks>.pick{position:relative;background:transparent;border-radius:0}
.picks>.pick:first-child{border-radius:14px 14px 0 0}
.picks>.pick:last-child{border-radius:0 0 14px 14px}
.picks>.pick+.pick::after{content:"";position:absolute;left:var(--seplead);right:16px;top:0;
  height:.5px;background:var(--sep);pointer-events:none}
.picks>.pick:hover::after,.picks>.pick:hover+.pick::after{opacity:0}
.pick{all:unset;display:grid;grid-template-columns:auto 1fr auto;column-gap:9px;align-items:baseline;
  box-sizing:border-box;width:100%;min-height:var(--tap);padding:12px 16px;border-radius:14px;cursor:pointer;
  background:var(--fill2);transition:background .15s}
.pick:hover,.pick:focus-visible{background:var(--fill)}
.pick:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pick::before{content:"";grid-row:1;align-self:center;width:8px;height:8px;border-radius:50%;background:var(--c)}
.pknm{grid-column:2;font:600 var(--t-head)/var(--t-head-lh) var(--f-body);letter-spacing:-.01em;color:var(--fg)}
/* the same round play mark the artist chips carry, so "playable" looks the same everywhere */
.pkgo{grid-column:2;display:inline-grid;place-items:center;margin-left:7px;vertical-align:-1px;
  color:color-mix(in srgb,var(--fg) 55%,transparent)}
.pkgo svg{width:12px;height:12px}
.pick:hover .pkgo{color:var(--fg)}
.pkfam{grid-column:3;grid-row:1;font:500 var(--t-foot) var(--f-mono);color:var(--muted);white-space:nowrap}
.pkwhy{grid-column:2/4;font-size:var(--t-sub);line-height:var(--t-sub-lh);color:var(--muted);margin-top:3px}
.chip span{flex:none;font-family:var(--f-mono);font-size:var(--t-foot);color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:var(--t-sub);line-height:var(--t-sub-lh)}
.legend span{display:flex;align-items:center;gap:7px;min-width:0}
.legend i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
.legend small{margin-left:auto;font:400 var(--t-foot) var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:var(--t-sub);margin:0}


.secbody[hidden]{display:none}
.secbody{padding-bottom:2px}
button.showmore{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:var(--tap);margin-top:8px;padding:0;border:0;background:none;color:var(--link);font:400 var(--t-body)/var(--t-body-lh) var(--f-body);text-align:left;cursor:pointer}
button.showmore:hover{text-decoration:underline}
button.showmore svg{width:16px;height:16px;transition:transform .2s}
button.showmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.srcs{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-sub);line-height:var(--t-sub-lh)}
a.am{color:inherit;text-decoration:none;transition:color .15s,background .15s}
a.am:hover{color:var(--accent)}
.srcs a{color:var(--accent);text-decoration:none}
.srcs a:hover{text-decoration:underline}
.ck{font-style:normal;font-weight:700;color:var(--ok)}
.tally{font-size:var(--t-foot);line-height:var(--t-foot-lh);color:var(--muted);margin:16px 0 0;font-variant-numeric:tabular-nums}

/* ---- floating Wikipedia reader ---- */
#wikiwrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center}
#wikiwrap[hidden]{display:none}
#wikibd{position:absolute;inset:0;background:rgb(0 0 0 / .32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:wfade .18s ease}
#wikicard{position:relative;display:flex;flex-direction:column;width:min(860px,94vw);height:min(86vh,900px);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgb(0 0 0 / .32),0 0 0 .5px var(--line);animation:wpop .22s cubic-bezier(.32,.72,0,1)}
@keyframes wfade{from{opacity:0}}
@keyframes wpop{from{opacity:0;transform:translateY(10px) scale(.985)}}
#wikicard header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-bottom:.5px solid var(--line);background:var(--glass)}
#wikittl{flex:1;min-width:0;font:600 14px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wikiout{flex:none;font:600 12px var(--f-body);color:var(--accent);text-decoration:none;padding:6px 10px;border-radius:999px;background:var(--fill)}
#wikix{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:var(--fill);color:var(--fg);font-size:13px;cursor:pointer}
#wikix:hover,#wikiout:hover{background:color-mix(in srgb,var(--fill) 80%,var(--fg))}
#wikibody{flex:1;min-height:0;position:relative;background:#fff}
#wikiframe{width:100%;height:100%;border:0;display:block}
#wikifail{position:absolute;inset:0;display:grid;place-content:center;gap:12px;justify-items:center;text-align:center;padding:24px;margin:0;color:var(--muted);font:400 14px var(--f-body);background:var(--panel)}
#wikihint{position:absolute;left:0;right:0;bottom:0;padding:7px 14px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:.5px solid var(--line);font:400 11.5px var(--f-body);color:var(--muted);text-align:center}
#wikihint a{color:var(--accent);text-decoration:none;font-weight:600}
#wikifail[hidden]{display:none}
#wikifail .go{font:600 13px var(--f-body);color:#fff;background:var(--accent);padding:9px 16px;border-radius:999px;text-decoration:none}
@media (max-width:699px){ #wikicard{width:100vw;height:92%;align-self:end;border-radius:18px 18px 0 0} #wikiwrap{align-items:end} }
/* ---- floating pill (minimized) + overlay card (expanded) ---- */
body.open #bar{position:absolute;z-index:41;top:calc(env(safe-area-inset-top,0px) + 30px + 10px);left:calc(var(--stripw,28px) + 14px);display:flex;flex-direction:column;align-items:flex-end}
#barRow{display:flex;align-items:center;gap:8px}
/* the style's identity now lives in the overlay card */
#panelBody{min-height:0;overflow:auto;overscroll-behavior:contain}
body:not(.open) #panelBody{overflow:visible}
.more{display:none}
.more .note{margin-top:16px}
body.open .more{display:block}
#ptoggle{display:none}
#pclose{display:grid;position:absolute;top:10px;right:10px;z-index:3;width:var(--tap);height:var(--tap);border:0;border-radius:50%;background:var(--fill);color:var(--fg);cursor:pointer;place-items:center}
body:not(.open) #pclose{transform:rotate(180deg)}
#pclose:hover{background:color-mix(in srgb,var(--fill) 75%,var(--fg))}
#pclose svg{width:17px;height:17px}
.pcard .mn{padding-right:0}
body:not(.open) aside{cursor:pointer;width:min(215px,23vw)}
body:not(.open) .pcard .my{display:block;white-space:normal;overflow:visible}
/* except on the title button, where the chevron belongs beside the year rather than
   dropped onto a line of its own */
body:not(.open) .pcard button.navttl .my{display:inline-flex}
body:not(.open) .pcard .my .fam,body:not(.open) .pcard .my .yr{display:inline;white-space:normal;overflow:visible;text-overflow:clip}
body:not(.open) .pcard .meta{align-items:flex-start;gap:6px}
@media (max-width:699px){ body:not(.open) aside{left:auto;width:min(50vw,230px)} }
body:not(.open) aside{cursor:pointer}
body:not(.open) aside:hover{background:var(--panel)}
.pcnt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font:400 var(--t-sub)/var(--t-sub-lh) var(--f-body);color:var(--muted)}
.pcnt svg{width:15px;height:15px;flex:none}
body.open .pcnt{display:none}
.pcard{margin:0}
/* the open state once drew a rule under the card; the spacing for it drifted the
   whole sheet down by 18px after the rule itself was dropped */
.pcard .mn{display:block;font-weight:600;font-size:var(--t-head);letter-spacing:-.014em;line-height:var(--t-head-lh);margin:0 0 1px}
.navrow{position:sticky;top:0;z-index:35;display:grid;--navside:118px;grid-template-columns:var(--navside) minmax(0,1fr) var(--navside);
  align-items:center;gap:8px;margin:0;padding:6px 0 7px;background:transparent;
  transition:background .18s}
.navrow .navback{justify-self:start}
/* back and share share the left track: the row is three columns, and a fourth child
   would push the title out of the middle one */
.navrow .navleft{justify-self:start;display:flex;align-items:center;gap:8px}
/* every panel minimises from the same corner, where a card's close control is looked for */
.pmin{all:unset;box-sizing:border-box;cursor:pointer;justify-self:end;flex:none;
  display:grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:50%;
  color:var(--muted);background:var(--fill2);transition:background .15s,color .15s}
.pmin:hover{background:color-mix(in srgb,var(--fg) 14%,transparent);color:var(--fg)}
.pmin:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pmin svg{width:17px;height:17px}
/* a sidebar has no smaller state to go to, so the control is not offered there */
@media (min-width:900px){ .pmin{display:none} }
/* both controls are pinned to the card's corners on every panel, so moving between the
   root and a style does not slide them a few pixels. It also keeps the root's row at its
   own height instead of a tap target's, which was pushing the large title down. */
.pcard .navrow{position:sticky}
/* the band has to reach the card's own edges. Inset by the body's padding, it left a
   channel down each side that whatever was scrolling underneath showed through. The
   row bleeds out and pads back in, so the grid keeps its width and only the two
   absolutely placed controls need the padding spelled out to stay where they were. */
.pcard .navrow{margin-inline:calc(var(--ppad) * -1);padding-inline:var(--ppad)}
.pcard .navrow .navleft,.pcard .navrow>#panelBack{position:absolute;left:var(--ppad);top:0;z-index:2}
.pcard .pmin{position:absolute;top:0;right:var(--ppad);z-index:2}
.ovcard .bigttl{padding-right:calc(var(--tap) + 8px)}
/* and the title gets out of their way rather than running under them */
.pcard .navrow .nav-lineage{grid-column:1 / -1;padding:0 calc(var(--tap) + 10px)}
/* and the lineage cluster is not part of the peek, which is for the playlist */
/* the peek used to hide this, which moved everything below it up: open the sheet and the
   playlist jumped down a hundred pixels, under whatever finger was reaching for it. The
   peek clips the card now rather than restacking it. */
.navrow .navleft .navback{justify-self:auto}
/* inside the group the hidden back takes no room, so share sits at the left edge when
   there is nothing to go back to. The title does not shift either way: the side tracks
   are a fixed width. */
.navrow .navleft .navback[hidden]{display:none}
/* From and Led to as one segmented control: a single pill split by a hairline, the way
   two related directions are usually grouped, rather than two separate buttons */
.navpair{display:flex;align-items:stretch;justify-self:end;flex:none;
  border-radius:999px;background:color-mix(in srgb,var(--acc,var(--fg)) 14%,transparent)}
.navpair .navwrap{position:relative;display:flex}
.navpair .navbtn{background:transparent;border-radius:0}
.navpair .nav-from .navbtn{border-radius:999px 0 0 999px;padding-left:12px}
.navpair .nav-led .navbtn{border-radius:0 999px 999px 0;padding-right:12px}
.navpair .nav-led{border-left:1px solid color-mix(in srgb,var(--acc,var(--fg)) 22%,transparent)}
/* the root panel has one direction to go, so its button is a whole pill, not half of one */
/* the ways of browsing are one grouped list, the way a phone app lists collections:
   a single rounded card, a row each, and hairlines that start at the name rather than
   running the full width. --lrlead is that inset: padding + icon + gap. */
.listgrp{background:var(--fill2);border-radius:14px;overflow:hidden;--lrlead:57px}
.listgrp .navwrap{display:block;position:relative}
.listgrp .navwrap + .navwrap::after{content:"";position:absolute;left:var(--lrlead);right:0;top:0;
  height:.5px;background:var(--sep);pointer-events:none}
/* .two puts its pair side by side: the separator turns with them */
.listgrp.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.listgrp.two .navwrap + .navwrap::after{left:0;right:auto;top:8px;bottom:8px;height:auto;width:.5px}
.listgrp.two .listrow{padding:0 12px;gap:9px}
.listgrp.two .lrct{margin-left:auto}
.listrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:13px;
  width:100%;min-height:58px;padding:0 14px;color:var(--fg);transition:background .15s}
.listrow:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.listrow:focus-visible{outline:0;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.listrow .lrico{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
  background:color-mix(in srgb,var(--acc,var(--fg)) 30%,transparent);color:var(--fg)}
.listrow .lrico svg{width:18px;height:18px}
.listrow .lrlbl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:400 var(--t-body)/1.2 var(--f-body)}
.listrow .lrct{flex:none;font:400 var(--t-body)/1 var(--f-mono);color:var(--muted);font-style:normal;
  font-variant-numeric:tabular-nums}
.listrow .lrcv{flex:none;width:15px;height:15px;color:var(--muted);opacity:.7;transition:transform .18s}
/* the menu opens in place rather than pushing a screen in, so the chevron turns over */
.listrow[aria-expanded="true"] .lrcv{transform:rotate(180deg);opacity:1}
@media (prefers-reduced-motion:reduce){ .listrow .lrcv{transition:none} }
/* a root style has nothing before it, so that row is a statement rather than a control */
.listrow:disabled{cursor:default;opacity:.45}
.listrow:disabled:hover{background:transparent}
/* the one row that is a destination rather than a list keeps the count as a word and
   drops the chevron, since nothing opens */
.listrow.lrgo .lrct{font-family:var(--f-body);font-size:var(--t-sub)}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .listgrp{--lrlead:51px}
  .listrow{min-height:46px;padding:0 12px;gap:11px}
  .listrow .lrico{width:28px;height:28px;border-radius:7px}
  .listrow .lrico svg{width:16px;height:16px}
}
}
.navpair .navbtn:hover:not(:disabled){background:color-mix(in srgb,var(--acc,var(--fg)) 16%,transparent)}
/* back takes the left slot the From button used to hold, and keeps it empty when there
   is nothing behind you, so the title stays where it is either way */
.navback{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;
  min-width:var(--tap);max-width:min(32vw,136px);height:var(--tap);padding:0 16px 0 13px;
  border-radius:999px;cursor:pointer;color:var(--fg);background:var(--fill2)}
.navback .bklbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body)}
.navback .bkmap{display:none;width:20px;height:20px;flex:none}
.navback.tomap .bklbl{display:none}
.navback.tomap .bkmap{display:block}
.navback.tomap{padding:0 12px}
.navback[hidden]{display:grid;visibility:hidden;pointer-events:none}
.navback svg{width:20px;height:20px}
.navback:hover{background:var(--fill)}
.navback:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (max-width:899px){ .navback{min-width:var(--tap);height:var(--tap)} .navback svg{width:20px;height:20px} .navback .bklbl{font-size:var(--t-sub)} }
/* on the overview the row has no empty slot to hold, so the button simply goes away */
body.pscrolled .navrow{box-shadow:0 .5px 0 var(--line);background:var(--panel)}
body.pscrolled .pcard .navrow{border-radius:0}
@media (prefers-reduced-motion:reduce){ .navrow{transition:none} }
.navttl{min-width:0;text-align:center;overflow:hidden}
.navrow .navttl .mn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navttl .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navttl .mn{margin:0}
.navttl .my{justify-content:center}
/* the root title has no year under it, so its glyph sits beside the name instead */
/* one short button on the right and nothing on the left, so the side tracks that keep a
   style's long name centred are wider than this row needs and were clipping "Offshoots" */
.ovcard .navrow{--navside:100px}   /* back and share side by side when both show */
/* the root is an index, so it takes the large left-aligned title an index gets: the row
   above keeps its two controls, and the name sits under them as the heading for the
   sections that follow. A style panel is a pushed screen and keeps its centred title. */
/* .pcard .mn sets the style-panel title's size, and this one is inside a .pcard too,
   so the span has to be told as well as the heading */
.ovcard .bigttl,.ovcard .bigttl .mn{margin:0;padding:0;text-align:left;display:block;
  font:700 34px/1.1 var(--f-body);letter-spacing:-.03em;color:var(--fg)}
.ovcard .bigttl{margin:4px 0 10px;padding:0}   /* flush with the section headings below */
@media (min-width:900px) and (hover:hover) and (pointer:fine){ .ovcard .bigttl,.ovcard .bigttl .mn{font-size:28px} }
.ovcard .navrow .navgap{min-height:0}
@media (max-width:899px){ .ovcard .bigttl{margin:4px 0 8px} }
/* beside the share button there is no room for the destination's name, and the two
   glyphs already say map and back */
.ovcard .navleft .navback{padding:0 12px;max-width:none}
.ovcard .navleft .navback .bklbl{display:none}

.navwrap{position:relative;flex:none}
.navbtn{display:flex;align-items:center;gap:4px;height:var(--tap);padding:0 10px;border:0;border-radius:999px;cursor:pointer;
  background:color-mix(in srgb,var(--acc,var(--fg)) 14%,transparent);color:var(--fg);
  font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body);transition:background .15s}
.navbtn:hover:not(:disabled){background:color-mix(in srgb,var(--acc,var(--fg)) 24%,transparent)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn .cv{width:16px;height:16px;flex:none}
.navbtn .ct{font:600 var(--t-foot) var(--f-mono);font-style:normal;opacity:.85;
  min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
/* browse menus in the overview */
.browse{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 2px}
/* the featured row: one concrete thing to listen to, with a re-roll beside it */
.feat{display:flex;align-items:stretch;gap:8px}
.featpick{flex:1 1 auto;min-width:0}

.shuf{all:unset;flex:none;display:grid;place-items:center;width:46px;border-radius:14px;cursor:pointer;
  background:var(--fill2);color:var(--muted);transition:background .15s,color .15s}
.shuf:hover{background:var(--fill);color:var(--fg)}
.shuf:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.shuf svg{width:18px;height:18px}
/* the methodology stays one tap away instead of ending the panel */
/* these two are not content, they are about the thing the content is in: a colophon.
   They lose the filled cards, which gave them the same weight as the ways in, and read as
   quiet rows under a rule instead. The rule is what separates them from the map above. */
.fold{margin-top:0;padding:0;background:none;border-radius:0}
.fold[open]{padding-bottom:14px}
.fold summary{display:flex;align-items:center;gap:11px;
  list-style:none;cursor:pointer;min-height:var(--tap);padding:0;
  font:400 var(--t-body)/var(--t-body-lh) var(--f-body);color:var(--muted)}
.fold summary .foldi{flex:none;display:grid;place-items:center;width:19px;height:19px;color:var(--muted)}
.fold summary .foldi svg{width:19px;height:19px}
.fold summary span{flex:1;min-width:0}
.fold summary:hover,.fold summary:hover .foldi,.fold[open] summary{color:var(--fg)}
/* The group is set off by a hairline that starts where its labels start, the same inset
   the list separators use. A rule across the full width is the ham-fisted one these
   folds were given shaded blocks to avoid; the inset says "these belong together"
   without drawing a line through the panel. */
.sect-learn{margin-top:26px;padding-top:7px;position:relative}
.sect-learn::before,.fold + .fold::before{content:"";position:absolute;left:30px;right:0;top:0;
  height:.5px;background:var(--sep)}
.fold + .fold{position:relative}
.fold summary::-webkit-details-marker{display:none}
.fold summary:hover{color:var(--fg)}
.fold summary .cv{flex:none;width:16px;height:16px;transition:transform .18s}
.fold[open] summary .cv{transform:rotate(180deg)}
.fold .about{margin-top:2px}
@media (prefers-reduced-motion:reduce){ .fold summary .cv{transition:none} }
.nav-br .navmenu{left:0}
.brbtn{height:var(--tap);padding:0 16px;gap:8px;background:var(--fill2)}
.brbtn:hover:not(:disabled){background:var(--fill)}
.brlbl{font:500 var(--t-sub)/var(--t-sub-lh) var(--f-body)}
.brbtn .cv{width:15px;height:15px;opacity:.7}
.brmenu{min-width:252px}
.brback{position:sticky;top:-5px;z-index:1;background:var(--panel);
  box-shadow:0 .5px 0 var(--line);border-radius:9px 9px 0 0;color:var(--muted)}
.brback .nm{font-weight:600;color:var(--fg)}
.brback .bk{flex:none;display:flex;width:14px;height:14px;opacity:.8}
.brback .bk .cv{width:14px;height:14px}
.ovhint{margin:0 0 2px}
.navhd{padding:8px 12px;font:600 var(--t-foot)/var(--t-foot-lh) var(--f-body);letter-spacing:0;text-transform:none;color:var(--mmut)}
.navmenu{--mbg:#f5f5f7; --mfg:#1a1a1c; --mmut:#6a6a70;
  position:absolute;z-index:40;top:calc(100% + 6px);min-width:210px;max-width:min(300px,70vw);
  max-height:min(52vh,380px);overflow:auto;overscroll-behavior:contain;padding:5px;
  background:var(--mbg);color:var(--mfg);border-radius:12px;
  box-shadow:0 0 0 .5px rgb(0 0 0 / .18),0 12px 32px rgb(0 0 0 / .45)}
.nav-from .navmenu{left:0}
.nav-led .navmenu{right:0}
.navmenu[hidden]{display:none}
body > .navmenu{z-index:70}
.navmenu button{all:unset;display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;
  min-height:var(--tap);padding:9px 12px;border-radius:11px;cursor:pointer;color:var(--mfg);font:400 var(--t-body)/var(--t-body-lh) var(--f-body)}
.navmenu button:hover{background:rgb(0 0 0 / .07)}
.navmenu button:focus-visible{background:rgb(0 0 0 / .07)}
.navmenu .dot{flex:none;width:9px;height:9px;border-radius:50%}
.navmenu .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navmenu small{flex:none;font:500 var(--t-foot) var(--f-mono);color:var(--mmut)}
@media (max-width:899px){
  .navbtn{height:var(--tap);padding:0 11px}
  .navmenu{min-width:244px;max-width:min(330px,82vw);padding:6px}

  background:var(--fg);color:var(--bg);box-shadow:0 2px 10px rgb(0 0 0 / .4)}

}

#bottomSearch{position:fixed;z-index:60;left:50%;right:auto;transform:translateX(-50%);width:min(520px,calc(100vw - 2*var(--gutter)));top:calc(var(--axh,34px) + 12px);bottom:auto;display:none}

@media (min-width:900px){

}

  -webkit-backdrop-filter:none;backdrop-filter:none;

.about{margin-top:12px;padding-top:0}

.abouthd{display:flex;align-items:center;gap:12px;margin:0 0 12px}

.aboutcopy{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;cursor:pointer;
  min-height:var(--tap);margin-top:8px;color:var(--link);

}

/* ---- docked layout: left sidebar on desktop, bottom sheet on phones ---- */
#app{display:flex;flex-direction:row}

#bar{position:absolute;z-index:41;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;display:flex;flex-direction:column;align-items:flex-start}
aside#panel{position:relative;z-index:30;flex:0 0 var(--sidew);width:var(--sidew);height:100%;max-height:none;top:auto;right:auto;left:auto;
  border-radius:0;box-shadow:none;border-left:.5px solid var(--line);background:var(--panel);
  -webkit-backdrop-filter:none;backdrop-filter:none;animation:none;overflow:hidden}
/* a wash of the family's cover-art ground; --tint is set per selection.
   the muted ink is darkened/brightened to hold contrast over the wash. */
aside#panel{transition:background .25s}
/* the panel becomes the shelf's field, the same in light and dark:
   --tint is the ground, --ink the type, --acc the link colour; the rest is derived */
aside#panel.tinted{
  --panel:var(--tint); --fg:var(--ink); --accent:var(--acc); --accent-fg:var(--tint);
  --muted:color-mix(in srgb,var(--ink) 72%,var(--tint));
  --line:color-mix(in srgb,var(--ink) 30%,var(--tint));
  --sep:color-mix(in srgb,var(--ink) 16%,transparent);
  --sectline:color-mix(in srgb,var(--ink) 38%,var(--tint)); --sectw:1px;
  --fill:color-mix(in srgb,var(--acc) 20%,var(--tint));
  --fill2:color-mix(in srgb,var(--acc) 13%,var(--tint));
  background:var(--tint);color:var(--ink)}
body:not(.open) aside#panel{width:var(--sidew);cursor:pointer}
#panelBody{flex:1 1 auto;min-height:0}
:root{--sidew:402px}

  :root{--sidew:auto}
  #app{flex-direction:column}
  #bar{left:14px}
  /* the sheet floats over the map rather than docking under it, so the lines of the
     map carry on behind the frosted ground. The map keeps its full height and stops
     relaying out every time the sheet opens; centerOn subtracts the covered band. */
  aside#panel{order:1;position:absolute;left:0;right:0;bottom:0;z-index:30;
    flex:0 0 auto;width:auto;height:auto;max-height:70vh;border-left:0;border-top:0;border-radius:16px 16px 0 0;box-shadow:0 -1px 0 var(--line),0 -10px 30px rgb(0 0 0 / .34),0 -3px 10px rgb(0 0 0 / .18);
    padding:2px 16px calc(14px + env(safe-area-inset-bottom,0px));

    -webkit-backdrop-filter:saturate(150%) blur(30px);backdrop-filter:saturate(150%) blur(30px)}
  /* the family wash goes translucent too, over its own ground rather than the root's */

// ---------- "open in Safari" ----------
// Add to Home Screen exists in Safari and nowhere else on iOS, so someone reading the
// install steps from Chrome, or from the browser inside Instagram or Slack, cannot follow
// them. A web page cannot choose a browser on a desktop, but both phone platforms have a
// scheme that can, so offer it to the people the steps do not work for.
function hereURL(){ return location.origin + location.pathname + location.search; }
const UA = navigator.userAgent;
function isiOS(){ return /iPad|iPhone|iPod/.test(UA) ||
  (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }   // iPadOS claims to be a Mac
function isAndroid(){ return /Android/.test(UA); }
// every iOS browser is WebKit, so Safari is told apart by what it is not: the other
// browsers' own tokens, and the in-app views, which carry no Version/ at all
function isSafari(){ return /Version\/[\d.]+/.test(UA) && /Safari/.test(UA) &&
  !/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|YaBrowser|DuckDuckGo|Instagram|FBAN|FBAV|FBIOS|Line\/|MicroMessenger|Snapchat/.test(UA); }
function isChrome(){ return /Chrome\//.test(UA) && !/EdgA?\/|OPR\/|SamsungBrowser|YaBrowser|DuckDuckGo/.test(UA); }
function installed(){ try{ return navigator.standalone===true ||
  matchMedia("(display-mode: standalone)").matches; }catch(e){ return false; } }
// the HTML for the row, or "" when the reader is already where they need to be
function openInRow(){
  const u=hereURL();
  // the schemes take the page's own protocol, but a file:// copy has no browser to open
  if(!/^https?:/.test(u) || installed()) return "";          // nothing to offer, or already added
  let href="", app="", note="";
  if(isiOS() && !isSafari()){
    href="x-safari-"+u; app="Safari";
    // on iOS this is not a preference: no other browser has the item at all
    note="You are not in Safari, and Add to Home Screen exists nowhere else on iOS. "
       + "If the button does nothing, tap <b>Share</b> and choose <b>Open in Safari</b>, which always works.";
  } else if(isAndroid() && !isChrome()){
    href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme="+location.protocol.replace(":","")+";package=com.android.chrome;"
       + "S.browser_fallback_url="+encodeURIComponent(u)+";end";
    app="Chrome";
    // unlike iOS, the browser you are in can almost certainly do this itself
    note="Your own browser can install this too, under its own menu. The steps below describe Chrome, "
       + "which is the one most people have.";
  } else return "";
  return '<p class="openin"><a href="'+href+'" rel="nofollow"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3h6v6"/><path d="M17 3l-8 8"/><path d="M15 12v4.2A1.8 1.8 0 0 1 13.2 18H4.8A1.8 1.8 0 0 1 3 16.2V7.8A1.8 1.8 0 0 1 4.8 6H9"/></svg><span>Open this page in '+app+'</span></a></p>'
   + '<p class="opennote">'+note+'</p>';
}

// the Share sheet is where Add to Home Screen lives, so on a browser that can open it
// from script there is no reason to send anyone off to find the button themselves
function canShareSheet(){ return !!(navigator.share && isiOS()); }
function shareStep(){ return canShareSheet()
  ? '<button type="button" class="sheetbtn" data-sharesheet>'+SHAREGLYPH+'<span>Open the Share sheet</span></button>'
  : ""; }
function openShareSheet(btn){
  const lbl=btn.querySelector("span");
  navigator.share({title:"Offshoots", url:hereURL()}).catch(()=>{
    // a dismissed sheet rejects exactly like a refused one, so only say something
    // if it is still here to be said to
    if(lbl) lbl.textContent="Use the Share button at the bottom of the screen";
  });
}

// ---------- sharing ----------
// every style has a URL: the page plus #id, which boot() already reads back
function styleURL(id){ return location.origin + location.pathname + location.search + "#" + encodeURIComponent(id); }
// "about" is the one hash that is not a style id
const ABOUT_HASH="about", INSTALL_HASH="install";
const FOLDS={[ABOUT_HASH]:".aboutwrap", [INSTALL_HASH]:".installwrap"};
function foldURL(hash){ return location.origin + location.pathname + location.search + "#" + hash; }
function openAbout(scroll,hash){
  const d=document.querySelector(FOLDS[hash||ABOUT_HASH]); if(!d) return false;
  if(!d.open) d.open=true;            // the toggle listener does the scrolling
  else if(scroll) d.dispatchEvent(new Event("toggle"));
  return true;
}
function setHash(id){
  const want = id ? "#"+encodeURIComponent(id) : "";
  if((location.hash||"") === want) return;
  // replace, not push: selecting styles shouldn't fill the back button
  try{ history.replaceState(null,"",want || location.pathname+location.search); }catch(e){ if(id) location.hash=want; }
}
function copyAbout(btn){
  const url=foldURL(btn.dataset.aboutcopy||ABOUT_HASH), lbl=btn.querySelector(".lbl");
  const flash=t=>{ if(!lbl) return; if(btn._was==null) btn._was=lbl.textContent;
    btn.classList.add("done"); lbl.textContent=t;
    clearTimeout(btn._t); btn._t=setTimeout(()=>{ btn.classList.remove("done");
      if(btn._was!=null){ lbl.textContent=btn._was; btn._was=null; } },1600); };
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); flash("Link copied"); }catch(e){ flash("Copy failed"); } ta.remove(); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>flash("Link copied"),fallback);
  else fallback();
}
function shareSel(){
  const id=state.sel, n=id?byId[id]:null;
  // nothing selected: share the map itself rather than doing nothing
  const url = n ? styleURL(id) : location.origin+location.pathname+location.search;
  const title = n ? "Offshoots · "+n.name : "Offshoots";
  const text  = n ? n.name+" on Offshoots" : "Offshoots — what grew out of what in North American music";
  const btn=document.querySelector("#panel [data-share]");
  // the wide button says what happened in words; the round one has no room for words, so
  // .done swaps its glyph for a tick and that is the whole message
  const flash=t=>{ if(!btn) return; const nm=btn.querySelector(".shlbl");
    if(nm && btn._was==null) btn._was=nm.textContent;
    btn.classList.add("done"); if(nm) nm.textContent=t;
    clearTimeout(btn._t); btn._t=setTimeout(()=>{ btn.classList.remove("done");
      if(nm && btn._was!=null){ nm.textContent=btn._was; btn._was=null; } },1600); };
  const copy=()=>{ const done=()=>flash("Link copied");
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>fallback());
    else fallback();
    function fallback(){ const ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ flash("Copy failed"); } ta.remove(); } };
  // the share sheet hands it to Messages, Mail and the rest; clipboard is the fallback
  if(navigator.share){
    navigator.share({title, text, url}).catch(err=>{
      if(err && (err.name==="AbortError"||err.name==="NotAllowedError")) return; copy(); });
  } else copy();
}

function syncShare(){
  const b=document.querySelector("#panel [data-share]"); if(!b) return;

// the panel takes a wash of the family's cover-art ground; strength lives in CSS
function setTint(fam){
  const s=(typeof FAMSKIN!=="undefined"&&FAMSKIN[fam])||null;
  const el=$("panel"); if(!el) return;
  if(s){ el.style.setProperty("--tint",s[0]); el.style.setProperty("--ink",s[1]); el.style.setProperty("--acc",s[2]); }
  else { el.style.removeProperty("--tint"); el.style.removeProperty("--ink"); el.style.removeProperty("--acc"); }
  el.classList.toggle("tinted",!!s);
}

let MODE=null;
function modePicks(m){
  return m[4].map(([id,why])=>{
    const n=byId[id]; if(!n) return "";
    const play=(typeof PLAY!=="undefined"&&PLAY[id])||(typeof SPLAY!=="undefined"&&SPLAY[id]);
    return `<button type="button" class="pick c" style="--c:${FAM[n.fam].c}" data-go="${esc(id)}" title="Show ${esc(n.name)} on the map">`
      + `<span class="pknm">${esc(n.name)}${play?`<i class="pkgo" aria-label="has a playlist">${PLAYGO}</i>`:""}</span>`
      + `<span class="pkwhy">${esc(why)}</span>`
      + `<span class="pkfam">${esc(FAM[n.fam].short)} · ${n.year}</span></button>`;

// twelve chips fill a phone screen, so the picks can open out of sight below them
// Bring the chosen mode's list to the top of the sheet. #panel is overflow:hidden and
// never scrolled, which is why the earlier version of this moved nothing at all: the
// scroller is #panelBody.
function showMode(){
  const body=$("panelBody"), o=body&&body.querySelector(".modeout");
  if(!o) return;
  const br=body.getBoundingClientRect(), or=o.getBoundingClientRect();
  body.scrollTo({top: body.scrollTop + (or.top-br.top) - 8, behavior: reduce?"auto":"smooth"});
}
// the way back: the chips' own section heading, not the chip row, so "What do you need
// it to do?" is on screen and the list reads as one thing you stepped into
function showChips(){
  const body=$("panelBody"), s=body&&body.querySelector(".modechips");
  if(!s) return;
  const head=s.closest(".sect")||s;
  const br=body.getBoundingClientRect(), hr=head.getBoundingClientRect();
  body.scrollTo({top: Math.max(0, body.scrollTop + (hr.top-br.top) - 8), behavior: reduce?"auto":"smooth"});
}
// About is the last thing in the panel, so opening it laid the text out below the fold
// and the tap looked like it had done nothing. Bring the row up to the top of the panel
// so the text you just asked for is the text you are looking at.
// toggle does not bubble, so this has to listen on the capture phase.
document.addEventListener("toggle",e=>{
  const d=e.target;
  if(!d.classList || !d.classList.contains("fold") || !d.open) return;
  const body=$("panelBody"); if(!body) return;
  requestAnimationFrame(()=>{
    const br=body.getBoundingClientRect(), dr=d.getBoundingClientRect();
    body.scrollTo({top: Math.max(0, body.scrollTop + (dr.top-br.top) - 8), behavior: reduce?"auto":"smooth"});
  });
},true);

// Families and influence as menus rather than two walls of chips. Same navwrap/navmenu
// machinery as the From and Led to buttons, so they portal, flip and close identically.
const TOPN=24;
function famCount(k){ return nodes.filter(n=>n.fam===k).length; }
function famMenuHtml(){
  const rows=[...FAMS].sort((x,y)=>famCount(y[0])-famCount(x[0])).map(([k,name])=>
    `<button type="button" role="menuitem" data-fambr="${k}" title="${esc(name)}: ${famCount(k)} styles"><i class="dot" style="background:${FAM[k].c}"></i><span class="nm">${esc(name)}</span><small>${famCount(k)}</small></button>`).join("");
  return `<div class="navhd">Families by size</div>${rows}`;
}
function famStylesHtml(k){
  const rows=nodes.filter(n=>n.fam===k).sort((x,y)=>x.year-y.year||x.name.localeCompare(y.name)).map(x=>
    `<button type="button" role="menuitem" data-go="${x.id}"><i class="dot" style="background:${FAM[x.fam].c}"></i><span class="nm">${esc(x.name)}</span><small>${x.year<1950?esc(x.disp):x.year}</small></button>`).join("");

function topMenuHtml(){
  const rows=[...nodes].sort((x,y)=>y.children.length-x.children.length||x.year-y.year).slice(0,TOPN).map(x=>
    `<button type="button" role="menuitem" data-go="${x.id}" title="${esc(x.name)} led to ${x.children.length} styles"><i class="dot" style="background:${FAM[x.fam].c}"></i><span class="nm">${esc(x.name)}</span><small>${x.children.length}</small></button>`).join("");

const hasPlay=id=>!!((typeof PLAY!=="undefined"&&PLAY[id])||(typeof SPLAY!=="undefined"&&SPLAY[id]));
const playable=()=>nodes.filter(n=>hasPlay(n.id));
// the first level: the styles nothing in this map leads to. The panel's forward button at
// the root points at these, so the map can be walked from its beginning as well as searched.
const firstLevel=()=>nodes.filter(n=>!n.parents.length).map(n=>n.id).sort(byYear);
function plCount(k){ return nodes.filter(n=>n.fam===k&&hasPlay(n.id)).length; }
// the catalog is 233 deep, so it drills by family rather than scrolling as one list
function plMenuHtml(){
  const rows=[...FAMS].filter(([k])=>plCount(k)).sort((x,y)=>plCount(y[0])-plCount(x[0])).map(([k,name])=>
    `<button type="button" role="menuitem" data-plbr="${k}" title="${esc(name)}: ${plCount(k)} playlists"><i class="dot" style="background:${FAM[k].c}"></i><span class="nm">${esc(name)}</span><small>${plCount(k)}</small></button>`).join("");

function plStylesHtml(k){

    `<button type="button" role="menuitem" data-go="${x.id}"><i class="dot" style="background:${FAM[x.fam].c}"></i><span class="nm">${esc(x.name)}</span><small>${x.year<1950?esc(x.disp):x.year}</small></button>`).join("");

  const np=playable().length;
  const withSrc=DATA.filter(r=>Array.isArray(r[7])&&r[7].length).length;
  $("panelBody").innerHTML=`<div class="pcard ovcard"><div class="navrow"><div class="navleft"><button id="panelBack" class="navback" type="button" hidden aria-label="Back" title="Back"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4.6"/><path d="M9.4 4.6L4 10l5.4 5.4"/></svg><span class="bklbl"></span><svg class="bkmap" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.8 5.4L7.4 3.4v11.2L2.8 16.6z"/><path d="M7.4 3.4l5.2 2v11.2l-5.2-2z"/><path d="M12.6 5.4l4.6-2v11.2l-4.6 2z"/></svg></button></div><div class="navttl navgap" aria-hidden="true"></div>${CLOSEBTN}</div><h1 class="bigttl"><span class="mn">Explore</span></h1><div class="more">
    ${browseRow()}
    ${modeSect()}
    <p class="note ovhint">Or tap any style on the map to trace where it came from and what it led to.</p>
    <div class="sect sect-learn nohead"><div class="secbody"><details class="fold aboutwrap"><summary><i class="foldi"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.4"/><path d="M10 9.2v4.4"/><path d="M10 6.5h.01"/></svg></i><span>About this map</span><svg class="cv" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg></summary>
    <div class="about"><div class="abouthd"><img class="appicon" alt="" src="${ICONSRC()}"><p class="stats">${$("stats").textContent} · ${np} with a playlist</p></div>
    <h4 class="subh">What it is for</h4>
    <p>Every style here is placed at the year it cohered into a named, recorded scene, and joined to the styles it grew out of. Time runs left to right, so following a line backwards shows you what a sound is made of.</p>
    <p>It is not trying to settle anything. It is trying to make the inheritance visible, so you can get from a record you already love to the thing it came out of, and hear why they are related.</p>
    <h4 class="subh">Where it comes from</h4>
    <p>This was compiled by hand, not pulled from a database. Styles, years and parentage come from the general music-historical record: scene histories, discographies, reference works and critical writing, cross-checked where accounts disagree. ${withSrc} entries carry a Sources list naming the pages they were checked against. The others stand on that general reading and are not individually cited.</p>
    <p>A link means one style is a direct stylistic parent of another, not every influence on it and not merely something it shared a decade with. Years mark when a scene cohered, not its earliest precursor. Styles from elsewhere appear when they charted here or seeded scenes here.</p>
    <p>Boundaries, dates and parentage are all contested, and a lineage is a reading rather than a fact. Take each link as the consensus view and the map as an argument you are free to disagree with.</p>
    <h4 class="subh">The playlists</h4>
    <p>Each playlist runs in chronological order, and the first few tracks are deliberately not the style proper. They are the records that pushed it into being, or the earliest examples of it, cut before anyone had a name for it.</p>
    <p>So a playlist starts just outside its own style and arrives at it, which is the same move the map makes. If the opening tracks sound like something else, that is the point: that is what it grew out of.</p>
    <h4 class="subh">Reading the map</h4>
    <p>A play triangle inside a dot marks a style with a playlist, linked in its panel. The bigger the name, the more styles grew out of it. Everything before 1950 sits left of the divider, on its own compressed scale, and is set in italic. Zoomed out, the styles that led nowhere show as plain dots.</p>
    <button type="button" class="aboutcopy" data-aboutcopy="about"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.4 11.6a3.2 3.2 0 0 0 4.6 0l2.6-2.6a3.2 3.2 0 0 0-4.6-4.6l-1 1"/><path d="M11.6 8.4a3.2 3.2 0 0 0-4.6 0L4.4 11a3.2 3.2 0 0 0 4.6 4.6l1-1"/></svg><span class="lbl">Copy a link to this</span></button></div></details><details class="fold installwrap"><summary><i class="foldi"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v8.6"/><path d="M6.4 8.4L10 12l3.6-3.6"/><path d="M4.2 14.2v1.4a1.4 1.4 0 0 0 1.4 1.4h8.8a1.4 1.4 0 0 0 1.4-1.4v-1.4"/></svg></i><span>How to install it</span><svg class="cv" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg></summary><div class="about">${openInRow()}<p>Offshoots is a web page, so there is nothing to download and no app store. Every platform below can pin it to a home screen or dock, where it opens full screen with no browser chrome around it.</p><h4 class="subh">iPhone and iPad</h4><ol class="steps"><li>Open this page in <b>Safari</b>. Chrome and Firefox on iOS cannot do this.</li><li>Tap the <b>Share</b> button, the square with an arrow coming out of it: ${SHAREGLYPH}${shareStep()}</li><li>Scroll down the list and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><h4 class="subh">Android</h4><ol class="steps"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>three dots</b> at the top right.</li><li>Tap <b>Add to Home screen</b>, then <b>Install</b> or <b>Add</b>. Samsung Internet and Firefox have the same item in their own menus.</li></ol><h4 class="subh">Mac</h4><ol class="steps"><li>In <b>Safari</b>, choose <b>File &rsaquo; Add to Dock</b>, then <b>Add</b>. It lands in the Dock and opens in its own window.</li><li>In <b>Chrome</b>, the same thing is under the three dots at <b>Cast, Save and Share &rsaquo; Install page as app</b>.</li></ol><h4 class="subh">Windows</h4><ol class="steps"><li>In <b>Edge</b> or <b>Chrome</b>, look for the <b>install icon</b> at the right-hand end of the address bar, a monitor with an arrow in it, and click it.</li><li>No icon there? Open the <b>three dots</b> menu and choose <b>Apps &rsaquo; Install this site as an app</b> in Edge, or <b>Cast, Save and Share &rsaquo; Install page as app</b> in Chrome.</li><li>Tick <b>Pin to taskbar</b> when it offers, and it behaves like any other app.</li></ol><h4 class="subh">What you get</h4><p>The whole map is a single file, so once it has loaded it keeps working without a connection. The playlist links still need one, since those open Apple Music or Spotify.</p><button type="button" class="aboutcopy" data-aboutcopy="install"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.4 11.6a3.2 3.2 0 0 0 4.6 0l2.6-2.6a3.2 3.2 0 0 0-4.6-4.6l-1 1"/><path d="M11.6 8.4a3.2 3.2 0 0 0-4.6 0L4.4 11a3.2 3.2 0 0 0 4.6 4.6l1-1"/></svg><span class="lbl">Copy a link to this</span></button></div></details></div>${appShareBtn()}</div></div>`;

// ---------- floating Wikipedia reader ----------
const wrap=$("wikiwrap"), wframe=$("wikiframe"), wfail=$("wikifail");
let wtimer=0;
function mobileWiki(u){ return u.replace("://en.wikipedia.org","://en.m.wikipedia.org"); }
function openWiki(url,title){
  $("wikittl").textContent=title; $("wikiout").href=url; wfail.querySelector(".go").href=url; $("wikihintlink").href=url;
  wfail.hidden=true; wframe.hidden=false; wframe.src=mobileWiki(url);
  wrap.hidden=false; document.body.style.overflow="hidden";
  clearTimeout(wtimer); wtimer=setTimeout(()=>{ if(!wframe.dataset.ok) wikiFail(); },3500);
}
function wikiBlocked(){ // a refused frame sits on about:blank (readable); a real article is cross-origin and throws
  try{ const h=wframe.contentWindow && wframe.contentWindow.location.href; return !h || h==="about:blank"; }catch(e){ return false; }
}
function wikiFail(){ clearTimeout(wtimer); wfail.hidden=false; wframe.hidden=true; }
wframe.addEventListener("load",()=>{ if(wikiBlocked()){ wikiFail(); return; } wframe.dataset.ok="1"; clearTimeout(wtimer); wfail.hidden=true; });
wframe.addEventListener("error",wikiFail);
function closeWiki(){ wrap.hidden=true; wframe.removeAttribute("src"); delete wframe.dataset.ok; clearTimeout(wtimer); document.body.style.overflow=""; }
wrap.addEventListener("click",e=>{ if(e.target.closest("[data-wclose]")) closeWiki(); });
document.addEventListener("click",e=>{ const a=e.target.closest("a.wk:not(.pl):not(.sp)"); if(!a) return; e.preventDefault(); openWiki(a.href, a.dataset.name||"Wikipedia"); });

// ---------- search ----------
const q=$("q"), res=$("res"); let hits=[], act=0;
function find(t){
  t=t.trim().toLowerCase(); if(!t) return [];
  // a title match is worth less than a name, a note or an artist, and is not tried at all
  // on a short query, where a word like "you" would match most of the playlists at once
  const score=n=>{ const nm=n.name.toLowerCase(); if(nm.startsWith(t)) return 0; if(nm.includes(t)) return 1;
    if(n.search.includes(t)) return 2; if(t.length>=4 && n.songsearch.includes(t)) return 3; return 9; };
  return nodes.map(n=>[score(n),n]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].year-b[1].year).slice(0,8).map(a=>a[1]);
}
function hitLine(n){ const t=q.value.trim().toLowerCase(), has=x=>x.toLowerCase().includes(t);
  // name the artist that matched, whether it is one of the three on the panel or
  // one of the deeper playlist names, so the row says why it is in the list
  const m=n.artists.find(has)||n.roster.find(has);
  if(m && !n.note.toLowerCase().includes(t)) return m+" · "+n.note;
  // nothing else matched, so it was a track title: quote it, since a bare title reads as a note
  const sg = t.length>=4 && !n.note.toLowerCase().includes(t) && n.songs.find(has);
  return sg ? "\u201c"+sg+"\u201d · "+n.note : n.note; }
function renderHits(){
  if(!hits.length){ res.hidden=true; return; }
  res.innerHTML = hits.map((n,i)=>`<li><button class="${i===act?"act":""}" data-go="${n.id}" role="option"><span>${esc(n.name)}</span><small>${n.year<1950?esc(n.disp):n.year} · ${esc(hitLine(n))}</small></button></li>`).join("");
  res.hidden=false;
}
(function(){ const f=q.closest("form"); if(f) f.addEventListener("submit",e=>e.preventDefault()); })();
q.addEventListener("input",()=>{ hits=find(q.value); act=0; renderHits(); qsync(); });
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ act=Math.min(act+1,hits.length-1); renderHits(); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ act=Math.max(act-1,0); renderHits(); e.preventDefault(); }
  else if(e.key==="Enter"&&hits[act]){ go(hits[act].id); q.blur(); }
  else if(e.key==="Escape"){ res.hidden=true; }
});
res.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b){ go(b.dataset.go); q.blur(); } });
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) res.hidden=true; });
function go(id){ res.hidden=true; q.value=""; qsync(); document.body.classList.remove("searching"); select(id);
  panelTop(); }
// a cover that isn't there just disappears; error doesn't bubble, so listen on the capture phase
// a cover that fails once is usually a hiccup; only a second failure means there is no file,
// and then a tile keeps the row the same shape instead of collapsing it
$("panelBody").addEventListener("error",e=>{
  const t=e.target; if(!t||t.tagName!=="IMG"||!t.classList.contains("pcov")) return;
  if(!t.dataset.retried){
    t.dataset.retried="1";
    const src=(t.getAttribute("src")||"").split("?")[0];
    setTimeout(()=>{ if(t.isConnected) t.src=src+"?r=1"; },500);
    return;
  }
  const ph=document.createElement("span");
  ph.className="pcov pcovph"; ph.setAttribute("aria-hidden","true");
  if(t.dataset.c) ph.style.setProperty("--c",t.dataset.c);
  ph.innerHTML="<b></b>"; ph.firstChild.textContent=t.dataset.ini||"";
  t.replaceWith(ph);
},true);

function panelTop(){ const pb=$("panelBody"); if(!pb) return; pb.scrollTop=0; document.body.classList.remove("pscrolled"); setTimeout(()=>{ pb.scrollTop=0; document.body.classList.remove("pscrolled"); },60); }
function qsync(){ const b=$("qclear"); if(b) b.hidden = !q.value; }
function openSearch(){
  // iOS only raises the keyboard if focus happens inside the tap itself, so do it first and synchronously
  document.body.classList.add("searching");
  q.focus({preventScroll:true});

  qsync();
}
function closeSearch(){
  document.body.classList.remove("searching");
  q.value=""; hits=[]; act=0; res.hidden=true; qsync();
}
q.addEventListener("blur",()=>setTimeout(()=>{ if(!q.value && !res.matches(":hover")) closeSearch(); },180));
q.addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); closeSearch(); } });
(function(){
  const b=$("qclear"); if(!b) return;
  b.addEventListener("click",()=>{ q.value=""; hits=[]; act=0; res.hidden=true; qsync(); q.focus(); });
})();

// ---------- zoom ----------
function updZoom(){ const pct=Math.round(Z*100)+"%"; $("zreset").textContent=pct; $("zin").disabled=Z>=ZMAX; $("zout").disabled=Z<=ZMIN; $("zreset2").hidden = Math.abs(Z-1)<.001; $("zpct").textContent=pct; }
function setZoom(z){
  z=Math.min(ZMAX,Math.max(ZMIN,Math.round(z*10)/10)); if(z===Z) return;
  const fx=(scroller.scrollLeft+scroller.clientWidth/2)/W, fy=(scroller.scrollTop+scroller.clientHeight/2)/(H+AXH+BAR());
  Z=z; render(); if(state.sel) select(state.sel,{scroll:false,repaint:false});
  scroller.scrollLeft=fx*W-scroller.clientWidth/2; scroller.scrollTop=fy*(H+AXH+BAR())-scroller.clientHeight/2;
  updZoom();
}
$("zin").onclick=()=>setZoom(Z+.1);
$("zout").onclick=()=>setZoom(Z-.1);
$("zreset").onclick=()=>setZoom(1);
$("zreset2").onclick=()=>setZoom(1);
scroller.addEventListener("keydown",e=>{ if(e.key==="+"||e.key==="="){setZoom(Z+.1);e.preventDefault();} else if(e.key==="-"){setZoom(Z-.1);e.preventDefault();} else if(e.key==="0"){setZoom(1);e.preventDefault();} });
scroller.addEventListener("wheel",e=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(Z+(e.deltaY<0?.1:-.1)); } },{passive:false});
// pinch-to-zoom (touch): scale about the midpoint, snapping to 5% steps
let pinch=null;
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
// Drag the map with a mouse. A trackpad pans on its own and a phone has fingers;
// a mouse has a wheel and nothing else, so the map is grabbed from empty space and
// pushed. Anything that already answers a click is left alone, and the pan only
// starts after a few pixels, so clicking the background still clears the selection.
let pan=null;
const PANSLOP=3, PANSKIP=".n,a,button,input,select,textarea,[data-go],[data-menu]";
function endPan(){
  if(!pan) return;
  const moved=pan.on;
  try{ scroller.releasePointerCapture(pan.id); }catch(_){}
  pan=null; document.body.classList.remove("panning");
  // the drag ends over whatever it ends over, and that would read as a click on it
  if(moved){ const eat=ev=>{ ev.preventDefault(); ev.stopPropagation(); };
    addEventListener("click",eat,true); setTimeout(()=>removeEventListener("click",eat,true),0); }
}
scroller.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||e.button!==0) return;
  if(e.target.closest&&e.target.closest(PANSKIP)) return;
  pan={id:e.pointerId,x:e.clientX,y:e.clientY,l:scroller.scrollLeft,t:scroller.scrollTop,on:false};
});
scroller.addEventListener("pointermove",e=>{
  if(!pan||e.pointerId!==pan.id) return;
  const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
  if(!pan.on){
    if(Math.abs(dx)<PANSLOP&&Math.abs(dy)<PANSLOP) return;
    pan.on=true; document.body.classList.add("panning");
    try{ scroller.setPointerCapture(pan.id); }catch(_){}
  }
  scroller.scrollLeft=pan.l-dx; scroller.scrollTop=pan.t-dy;
  e.preventDefault();
});
scroller.addEventListener("pointerup",endPan);
scroller.addEventListener("pointercancel",endPan);
addEventListener("blur",endPan);

scroller.addEventListener("touchstart",e=>{ if(e.touches.length===2){ const r=scroller.getBoundingClientRect(); const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top; pinch={d0:dist(e.touches),z0:Z,fx:(scroller.scrollLeft+mx)/W,fy:(scroller.scrollTop+my)/(H+AXH+BAR()),mx,my}; e.preventDefault(); } },{passive:false});
scroller.addEventListener("touchmove",e=>{ if(!pinch||e.touches.length!==2) return; e.preventDefault(); const z=Math.min(ZMAX,Math.max(ZMIN,Math.round(pinch.z0*dist(e.touches)/pinch.d0*10)/10)); if(z!==Z){ Z=z; render(); if(state.sel) select(state.sel,{scroll:false,repaint:false}); scroller.scrollLeft=pinch.fx*W-pinch.mx; scroller.scrollTop=pinch.fy*(H+AXH+BAR())-pinch.my; updZoom(); } },{passive:false});
scroller.addEventListener("touchend",e=>{ if(e.touches.length<2) pinch=null; });
scroller.addEventListener("touchcancel",()=>{ pinch=null; });
// iOS Safari fires gesture events for pinch; stop the page itself from zooming
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));


// ---------- boot & resize ----------
let RENDERED=false;
// space the floating search bar covers at the bottom, so the last lanes can always be scrolled clear of it
// GLIDING guards the inline max-height the sheet animation needs: this runs on a zero
// timeout from setOpen and would otherwise restore the 46vh cap before the first frame,
// clamping the closing animation to its end state instantly.
function sizeCard(){ const el=$("panel"); if(el && !GLIDING) el.style.maxHeight=""; }
// Breathing room under the map, plus whatever the floating sheet covers, so the lowest
// styles can still be scrolled up into the open band. The room has to clear the sheet's
// shadow as well as the sheet: that shadow reaches 30px up, so 24px of clearance left the
// last lane sitting in it and reading as stuck underneath.
function SRES(){ return (OVERLAY?56:24) + sheetCover(); }
// the map used to be resized by the sheet, so its ResizeObserver kept this honest. Now
// that the sheet floats, nothing observes the change and the padding has to be told.
function syncMapPad(){ const i=$("inner"); if(i) i.style.paddingBottom=SRES()+"px"; }
// The map used to be resized by the sheet, so one ResizeObserver on the scroller kept
// everything in step. The sheet floats now and the scroller never changes, so watch the
// sheet itself: this covers the first paint, a drag to a height of its own, a rotation
// and a mobile toolbar sliding away.
if(window.ResizeObserver){
  const pel=$("panel");
  if(pel) new ResizeObserver(()=>{ syncMapPad(); }).observe(pel);
}
function render(){ RENDERED=true; dims(); LOD = Z<0.9; $("chart").classList.toggle("lod",LOD); fit();
  const res=SRES(); $("inner").style.paddingBottom=res+"px"; measureHead();
  layout(scroller.clientHeight-AXH-BAR()-res-HEADH); draw(); }
let lastW=0,lastH=0,rt;
// the panel is docked, so opening or closing it changes the map viewport: re-lay out when that happens
let ro;
if(window.ResizeObserver){ let rot; ro=new ResizeObserver(()=>{ clearTimeout(rot); rot=setTimeout(()=>{ if(!RENDERED||DRAGGING) return; render(); if(state.sel) select(state.sel,{scroll:false,repaint:false}); },120); }); ro.observe(scroller); }
addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  if(innerWidth===lastW && Math.abs(innerHeight-lastH)<120) return; // ignore mobile toolbar jitter
  lastW=innerWidth; lastH=innerHeight;
  const wasOverlay=OVERLAY; render(); if(state.sel) select(state.sel,{scroll:false});

},150); });
function boot(){
  lastW=innerWidth; lastH=innerHeight; render(); updZoom();
  const h=(location.hash||"").slice(1);
  if(FOLDS[h]){
    emptyPanel(); scroller.scrollLeft=0; scroller.scrollTop=0; syncPeek();
    setOpen(true);                         // the sheet is closed on a phone by default
    setTimeout(()=>openAbout(true,h),420); // after the sheet has finished opening
  }
  else if(byId[h]) select(h,{smooth:false});
  else { emptyPanel(); scroller.scrollLeft = 0; scroller.scrollTop = 0; syncPeek(); }
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot,boot);
function kb(){
  sizeCard();
  const vv = window.visualViewport;
  const vh = vv ? vv.height : innerHeight;
  res.style.maxHeight = Math.max(120, Math.round(vh - 150)) + "px";
}
if(window.visualViewport){ visualViewport.addEventListener("resize",()=>{ kb(); clearTimeout(rt); rt=setTimeout(()=>{ fit(); },150); }); visualViewport.addEventListener("scroll",kb); }
q.addEventListener("focus",()=>{ setTimeout(kb,50); setTimeout(kb,350); });
q.addEventListener("blur",()=>{ setTimeout(kb,100); });
})();

</script>
